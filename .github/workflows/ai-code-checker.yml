name: Autonomous AI Code Quality & Error Checker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  code-quality-and-ai-audit:
    name: Lint, Build & AI Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🔍 Static Type & Syntax Check (tsc)
        run: npm run lint

      - name: ⚙️ Production Build Verification
        run: npm run build

      - name: 🤖 Automated Gemini AI Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ai-code-reviewer.js
