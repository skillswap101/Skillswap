name: Autonomous AI Code Quality, Security & Render Checker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  code-quality-and-ai-audit:
    name: Lint, Build, Security & AI Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🔍 TypeScript Verification (tsc --noEmit)
        run: npm run lint

      - name: ⚙️ Full Production Build (Vite + esbuild)
        run: npm run build

      - name: 🛡️ Autonomous AI Security & Render Deployment Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ai-code-reviewer.js
